<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="./frontend_dependancy/css/output.css">
</head>
<body class="bg-backgroundLight dark:bg-backgroundDark text-textPrimaryDark dark:text-textPrimaryLight transition-colors duration-300">
   <!-- TOP BAR -->
<div class="bg-bgsecLight dark:bg-bgsecDark w-full h-16 flex flex-row justify-between px-3 fixed top-0 left-0 z-50">
    <div class="flex flex-row justify-center items-center">
        <button class="hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"
                class="w-7 h-7 mr-1 fill-btnTextLight dark:fill-btnTextDark">
                <path d="M640-80 240-480l400-400 71 71-329 329 329 329-71 71Z" />
            </svg>
        </button>
    
        <div class="flex flex-col justify-start items-start leading-none">
            <span class="text-textPrimaryLight dark:text-textPrimaryDark text-2xl font-bold">History</span>
        </div>
    </div>

    <div class="w-min h-full flex justify-end items-center">
        <button id="menu-btn" class="hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"
                class="w-7 h-7 m-3 fill-btnTextLight dark:fill-btnTextDark">
                <path d="M120-240v-66.67h720V-240H120Zm0-206.67v-66.66h720v66.66H120Zm0-206.66V-720h720v66.67H120Z" />
            </svg>
        </button>
    </div>
</div>

<!-- Overlay -->
<div id="overlay" class="fixed inset-0 bg-backgroundDark bg-opacity-50 hidden transition-opacity"></div>

<!-- Sidebar Menu -->
<div id="sidebar" class="fixed right-0 top-0 z-50 h-full w-64 bg-backgroundLight dark:bg-backgroundDark 
    text-textPrimaryDark dark:text-textPrimaryLight rounded-l-2xl shadow-2xl border-l border-gray-300 dark:border-gray-700 
    transform translate-x-full transition-transform duration-300 p-5">

   <!-- Close Button -->
<button id="close-btn" class="flex justify-center items-center hover:scale-105 transition-transform">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 fill-btnTextLight dark:fill-btnTextDark stroke-btnTextLight dark:stroke-btnTextDark"
        viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
</button>

<ul class="space-y-2 mt-4">
    <li id="toggleTheme" class="p-3 flex items-center gap-3 rounded-lg cursor-pointer bg-accent hover:bg-accenthover transition border border-borderLight dark:border-borderDark mb-1">
        <span class="text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" 
                 class="w-6 h-6 fill-btnTextLight dark:fill-btnTextDark">
                <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
            </svg>
        </span> 
        <span class="fill-btnTextLight dark:fill-btnTextDark text-btnTextLight dark:text-btnTextDark">Dark Mode</span>
    </li>

    <li class="p-3 flex items-center gap-3 rounded-lg cursor-pointer hover:bg-gray-300 dark:hover:bg-gray-600 transition border border-borderLight dark:border-borderDark mb-1 text-btnTextLight dark:text-btnTextDark">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-btnTextLight dark:fill-btnTextDark">
            <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/>
        </svg>
        <span class="text-lg">Profile</span>
    </li>

    <li class="p-3 flex items-center gap-3 rounded-lg cursor-pointer hover:bg-gray-300 dark:hover:bg-gray-600 transition border border-borderLight dark:border-borderDark mb-1 text-btnTextLight dark:text-btnTextDark">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-btnTextLight dark:fill-btnTextDark">
            <path d="M240-400h320v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80ZM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240L80-80Z"/>
        </svg>
        <span class="text-lg">Chatbot</span>
    </li>

    <li class="p-3 flex items-center gap-3 rounded-lg cursor-pointer hover:bg-gray-300 dark:hover:bg-gray-600 transition border border-borderLight dark:border-borderDark mb-1 text-btnTextLight dark:text-btnTextDark">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-btnTextLight dark:fill-btnTextDark">
            <path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"/>
        </svg>
        <span class="text-lg">Settings</span>
    </li>

    <li class="p-3 flex items-center gap-3 bg-logBut text-btnTextLight dark:text-btnTextDark rounded-lg cursor-pointer hover:bg-hoverlogBut transition border border-hoverlogBut shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-btnTextLight dark:fill-btnTextDark">
            <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/>
        </svg>
        <span>Logout</span>
    </li>
</ul>
</div>

<!-- Order History Container -->
<div class="pt-20 p-5 max-w-5xl mx-auto">
    <div id="orderHistory" class="space-y-5 max-w-3xl mx-auto">
        <!-- Order cards will be injected here -->
    </div>
</div>

<script type="module">
    import { history_of_user } from './frontend_dependancy/js/history_of_user.js';
    const orderHistoryContainer = document.getElementById('orderHistory');

    function generateRatingStars(rating) {
        if (!rating) return 'N/A';
        
        const filledStar = '⭐';
        const emptyStar = '☆';
        const maxRating = 5;
        
        const filledStars = filledStar.repeat(rating);
        const emptyStars = emptyStar.repeat(Math.max(0, maxRating - rating));
        
        return filledStars + emptyStars;
    }

    history_of_user.forEach(order => {
        const totalItems = order.orders.reduce((sum, item) => sum + item.quntity, 0);
        
        const orderDiv = document.createElement('div');
        orderDiv.className = 'p-3 bg-secbackgroundLight dark:bg-secbackgroundDark rounded-lg border border-borderLight dark:border-borderDark shadow-md';
        
        // Create the mess name and address display with proper truncation
        const fullAddress = `${order.messName} - ${order.messAddress}`;
        const displayAddress = fullAddress.length > 40 ? fullAddress.substring(0, 40) + '...' : fullAddress;

        orderDiv.innerHTML = `
  <div class="flex items-center justify-between mb-1 w-full">
    <!-- Address Section with ellipsis -->
    <h2 class="text-lg font-medium text-textPrimaryLight dark:text-textPrimaryDark flex-1 overflow-hidden">
      <span class="inline-block w-full overflow-hidden text-ellipsis whitespace-nowrap" title="${fullAddress}">
        ${displayAddress}
      </span>
    </h2>

    <!-- Rating Box with fixed size -->
    <div class="min-w-[50px] h-6 border border-borderDark dark:border-borderLight rounded-md flex items-center justify-center text-sm font-semibold bg-gray-100 dark:bg-gray-700 px-2 shrink-0">
      <span class="text-textPrimaryLight dark:text-textPrimaryDark">${order.givenRating}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 fill-textPrimaryLight dark:fill-textPrimaryDark" viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
    </div>
  </div>

  <p class="text-sm text-textPrimaryLight dark:text-textPrimaryDark">${order.datetime}</p>
  <p class="text-sm text-textPrimaryLight dark:text-textPrimaryDark mt-1">
    ${totalItems} orders of ₹${order.totalAmountPaid}
  </p>
  <div class="mt-2 flex justify-end items-center gap-2">
    <button onclick="window.location.href='order_details.html?orderId=${order.historyId}'" 
      class="text-sm text-accent dark:text-accent hover:underline">
      View Details
    </button>
    <a href="order_details.html?orderId=${order.historyId}">
      <svg xmlns="http://www.w3.org/2000/svg" 
        class="h-6 w-6 fill-textPrimaryLight dark:fill-textPrimaryDark" 
        viewBox="0 -960 960 960">
        <path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z"/>
      </svg>
    </a>
  </div>
`;
 
        orderHistoryContainer.appendChild(orderDiv);
    });
</script>
<script src="./frontend_dependancy/js/theme-menu-toggle.js"></script>
</body>
</html>
