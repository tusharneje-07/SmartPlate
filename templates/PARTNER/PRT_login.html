<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Login - SmartPlate</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script defer src="{% static '/js/theme-menu-toggle.js' %}"></script>
    <!-- Add Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-backgroundLight dark:bg-backgroundDark min-h-screen font-lato">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md">
            <!-- Dark Mode Toggle -->
            <div class="flex justify-end mb-4">
                <button id="toggleTheme" class="p-3 rounded-lg bg-bgsecLight dark:bg-bgsecDark flex items-center gap-2 hover:bg-secbackgroundLight dark:hover:bg-secbackgroundDark transition-colors duration-200">
                    <span class="text-textPrimaryLight dark:text-textPrimaryDark">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" class="fill-current">
                            <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
                        </svg>
                    </span>
                    <span class="text-sm font-medium text-textPrimaryLight dark:text-textPrimaryDark">Dark Mode</span>
                </button>
            </div>

            <!-- Login Card -->
            <div class="bg-white dark:bg-secbackgroundDark rounded-xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-textPrimaryLight dark:text-textPrimaryDark">Partner Login</h2>
                    <p class="text-textPrimaryLight dark:text-textPrimaryDark mt-2 opacity-40">Welcome back! Please login to your account.</p>
                </div>

                <form class="space-y-6" action="{% url 'partner_login' %}" method="POST">
                    {% csrf_token %}
                    <!-- Username Input -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-textPrimaryLight dark:text-textPrimaryDark mb-2">Username</label>
                        <input type="text" id="username" name="username" 
                               class="w-full px-4 py-3 rounded-lg border border-borderLight dark:border-borderDark bg-backgroundLight dark:bg-backgroundDark text-textPrimaryLight dark:text-textPrimaryDark focus:ring-2 focus:ring-accent focus:border-transparent"
                               placeholder="Enter your username">
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="password" class="block mt-2 text-sm font-medium text-textPrimaryLight dark:text-textPrimaryDark mb-2">Password</label>
                        <input type="password" id="password" name="password" 
                               class="w-full px-4 py-3 rounded-lg border border-borderLight dark:border-borderDark bg-backgroundLight dark:bg-backgroundDark text-textPrimaryLight dark:text-textPrimaryDark focus:ring-2 focus:ring-accent focus:border-transparent"
                               placeholder="Enter your password">
                    </div>

                    <!-- Login Button -->
                    <button type="submit" 
                            class="w-full bg-logBut hover:bg-hoverlogBut text-white font-semibold mt-2 py-3 px-4 rounded-lg transition duration-300">
                        Login
                    </button>

                    <!-- Divider -->
                    <div class="relative my-8">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-borderLight dark:border-borderDark"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 py-2 bg-white dark:bg-secbackgroundDark text-gray-500">Or continue with</span>
                        </div>
                    </div>

                    <!-- Google Login Button -->
                    <a href="{% url 'partner-google-login' '1' %}" 
                       class="w-full flex items-center justify-center gap-3 bg-white dark:bg-backgroundDark border border-borderLight dark:border-borderDark hover:bg-gray-50 dark:hover:bg-bgsecDark text-textPrimaryLight dark:text-textPrimaryDark font-semibold py-3 px-4 rounded-lg transition duration-300">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Continue with Google
                    </a>
                </form>
            </div>
        </div>
    </div>

    {% if messages %}
    <div class="fixed bottom-4 right-4">
        {% for message in messages %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline">{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
