{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Orders</title>
    <link rel="stylesheet" href="{% static '/css/output.css' %}">
    <script>
        function toggleFullScreen() {
            const elementsToHide = document.querySelectorAll('.hide-on-fullscreen');
            elementsToHide.forEach(el => el.classList.toggle('hidden'));
        }
    </script>
</head>
<body class="bg-backgroundLight text-textPrimaryLight dark:bg-backgroundDark dark:text-textPrimaryDark">
    <input type="hidden" id="mess_user_id" value="{{id}}">
    <div class="w-full mx-auto p-6">
        <!-- Navbar -->
        <div class="flex justify-between items-center mb-6 hide-on-fullscreen">
            <button class="bg-secbackgroundLight dark:bg-secbackgroundDark px-6 py-2 rounded">Logo</button>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-textPrimaryLight dark:text-textPrimaryDark">Home</a>
                <a href="#" class="text-textPrimaryLight dark:text-textPrimaryDark">About Us</a>
                <a href="#" class="text-textPrimaryLight dark:text-textPrimaryDark">Profile</a>
                <button id="toggleTheme" class="flex items-center justify-center w-10 h-10 bg-secbackgroundLight dark:bg-secbackgroundDark text-textPrimaryLight dark:text-textPrimaryDark focus:outline-none p-2 rounded">
                    <span id="toggleIcon" class="w-6 h-6 block"></span>
                </button>
            </div>
        </div>
        <!-- Header -->
        <div class="flex items-center justify-between mb-4 hide-on-fullscreen">
            <div>
                <h1 class="text-textPrimaryLight dark:text-textPrimaryDark text-4xl mb-2 font-bold">Accept Orders</h1>
                <p class="text-textPrimaryLight dark:text-textPrimaryDark">Accept orders seamlessly and serve with speed—delight your customers with every meal!</p>
            </div>
            <div class="bg-secbackgroundLight dark:bg-secbackgroundDark rounded-md px-4 py-2">
                <div id="dateTime" class="bg-secbackgroundLight dark:bg-secbackgroundDark font-sans px-4 py-2 rounded-md text-sm "></div>
                </div>
        </div>
        <hr class="border-t border-borderLight dark:border-borderDark mb-4">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-4">
                
                <button onclick="toggleFullScreen()" class="bg-secbackgroundLight dark:bg-secbackgroundDark text-textPrimaryLight dark:text-textPrimaryDark px-4 py-2 rounded-lg flex items-center space-x-2">
                    <!-- Full Screen Expand Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8 3H5a2 2 0 00-2 2v3m13-5h3a2 2 0 012 2v3m0 7v3a2 2 0 01-2 2h-3m-7 0H5a2 2 0 01-2-2v-3" />
                    </svg>
                  
                    <span>Full Screen</span>
                  </button>                   
                
                  <button class="bg-secbackgroundLight dark:bg-secbackgroundDark text-textPrimaryLight dark:text-textPrimaryDark px-4 py-2 rounded-lg flex items-center space-x-2" onclick="window.location.reload(true)">
                    <!-- Trash Icon (representing Clear/Delete) -->
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
                  
                    <span>Hard Refresh</span>
                  </button>
                  
                  
                  <button class="bg-secbackgroundLight dark:bg-secbackgroundDark text-textPrimaryLight dark:text-textPrimaryDark px-4 py-2 rounded-lg flex items-center space-x-2" onclick="window.location.href='/partner/{{id}}/set_todays_menu/'">
                    <!-- Pencil Square Icon (Edit/Change Menu) -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 3.487a2.25 2.25 0 113.182 3.182L7.5 19.313 3 21l1.688-4.5L16.862 3.487z" />
                    </svg>
                  
                    <span>Change Menu</span>
                  </button>
                  
                  
               
                <div class="flex space-x-2">
                    <input type="radio" id="green" name="status" value="green" class="hidden peer/green" checked>
                    <label for="green" class="bg-green-300 peer-checked/green:bg-green-600 h-12 w-16 px-4 py-2 rounded-md transition cursor-pointer"></label>
                  
                    <input type="radio" id="yellow" name="status" value="yellow" class="hidden peer/yellow">
                    <label for="yellow" class="bg-yellow-300 peer-checked/yellow:bg-yellow-500 h-12 w-16 px-4 py-2 rounded-md transition cursor-pointer"></label>
                  
                    <input type="radio" id="red" name="status" value="red" class="hidden peer/red">
                    <label for="red" class="bg-red-300 peer-checked/red:bg-red-500 h-12 w-16 px-4 py-2 rounded-md transition cursor-pointer"></label>
                  </div>
            </div>
                        <button 
            id="toggleAcceptBtn"
            class="bg-secbackgroundLight dark:bg-secbackgroundDark text-textPrimaryLight dark:text-textPrimaryDark px-4 py-2 rounded-lg flex items-center space-x-2 transition">
            <span id="acceptStatusText">Accepting Orders</span>
            </button>
        </div>
        <div id="order-container" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
            <!-- Orders will be dynamically added here -->
        </div>        
    </div>
    <script>
        function updateDateTime() {
            document.getElementById("dateTime").textContent = new Date().toLocaleString();
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
    <script src="{% static '/js/PARTNER/PRT_themetoggle.js' %}"></script>
    <script src="{% static '/js/PARTNER/PRT_acceptOrder.js' %}"></script>
</body>
</html>
